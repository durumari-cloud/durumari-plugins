[project]
name = "durumari-mcp"
version = "0.4.99"
description = "Project-bound Cloud Context for Agents over MCP and CLI"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "keyring>=25,<27",
    "cryptography>=50.0.2,<51",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
durumari-mcp = "durumari_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durumari_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

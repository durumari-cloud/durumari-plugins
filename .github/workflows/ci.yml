name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Real Linux credential store for the keyring tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: Sync
        run: uv sync --project mcp --frozen
      - name: Lint
        run: uv run --project mcp --frozen ruff check .
      - name: Skill copies match their source
        run: uv run --project mcp --frozen python tools/skill-variants/render.py --check
      - name: Tests
        run: >-
          sh tools/linux-keyring.sh
          uv run --project mcp --frozen pytest mcp/tests hosts/agent/tests
          -q -p no:cacheprovider --basetemp "${{ runner.temp }}/pytest"

  build:
    name: build release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync --project mcp --frozen
      - name: Build release
        run: >-
          uv run --project mcp --frozen python tools/build_release.py
          --service-origin https://app.durumari.cloud
          --output dist/release --catalog-output dist/catalog
      - name: Build public Chat draft
        run: >-
          uv run --project mcp --frozen python hosts/chat/public/build.py
          --output "$PWD/dist/chat-public.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: dist/
          retention-days: 14

  commit-emails:
    name: commit emails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only noreply, bot or opensource@durumari.cloud addresses
        # A public repository publishes every author and committer address. Only GitHub
        # noreply, GitHub itself and opensource@durumari.cloud are accepted; the log
        # names offending commits, never the address.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$HEAD"
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..$HEAD"; fi
          bad=$(git log --format='%h %ae %ce' "$range" | awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com" && $i != "opensource@durumari.cloud") { print $1; break } }')
          if [ -n "$bad" ]; then
            echo "::error::Commit as opensource@durumari.cloud or a GitHub noreply address. Commits: $(echo $bad | tr '\n' ' ')"
            exit 1
          fi
